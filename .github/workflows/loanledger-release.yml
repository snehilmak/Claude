name: Release LoanLedger

# Builds the Windows installer and publishes a GitHub Release whenever you push
# a tag like `loanledger-v0.1.0`. The release includes the signed installer and
# a `latest.json` manifest that the app reads to auto-update existing users.
on:
  push:
    tags:
      - "loanledger-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/release, e.g. loanledger-v0.1.0"
        required: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: loanledger/src-tauri

      - name: Install frontend dependencies
        working-directory: loanledger
        run: npm ci

      - name: Run unit tests
        working-directory: loanledger
        run: npm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: loanledger
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "LoanLedger ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Download the `.exe` installer below to install or update LoanLedger. Existing installs update themselves automatically."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
